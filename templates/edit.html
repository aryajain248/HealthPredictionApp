<!DOCTYPE html>
<html>
<head>
    <title>Edit Patient</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

<h3>✏️ Edit Patient</h3>

<form method="POST">

    <input class="form-control mb-2" name="name" value="{{ patient[1] }}">
    <input class="form-control mb-2" name="dob" value="{{ patient[2] }}">
    <input class="form-control mb-2" name="email" value="{{ patient[3] }}">
    <input class="form-control mb-2" name="glucose" value="{{ patient[4] }}">
    <input class="form-control mb-2" name="haemoglobin" value="{{ patient[5] }}">
    <input class="form-control mb-2" name="cholesterol" value="{{ patient[6] }}">

    <button class="btn btn-success">Save Changes</button>
</form>

</body>
</html>
